---
- name: async | Async block
  block:
    - name: async | Manage Workflows nodes | Wait for finish the workflow node creation
      ansible.builtin.async_status:
        jid: "{{ __workflows_node_async_results_item.ansible_job_id }}"
      register: __workflows_node_async_result
      until: __workflows_node_async_result.finished
      retries: 10

  rescue:
    - name: async | Load error details
      ansible.builtin.include_vars:
        file: "{{ __workflows_node_async_result.results_file }}"
        name: error_data

    - name: async | Building list of not processed nodes
      ansible.builtin.set_fact:
        __workflow_nodes_error_list: "{{ __workflow_nodes_error_list | default([]) + [
                                                                      {
                                                                        'name': error_data['invocation']['module_args']['name'] | default ('N/A'),
                                                                        'type': 'node creation',
                                                                        'error': error_data['msg'] | default(__workflows_node_async_result['msg'])
                                                                      }
                                                                    ]
                                    }}"
