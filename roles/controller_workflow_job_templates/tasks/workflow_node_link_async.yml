---
- name: async | Async block
  block:
    - name: async | Managing Workflows | Wait for finish the workflow management
      ansible.builtin.async_status:
        jid: "{{ __workflows_link_async_results_item.ansible_job_id }}"
      register: __workflows_link_async_result
      until: __workflows_link_async_result.finished
      retries: "{{ controller_configuration_workflow_async_retries }}"
      delay: "{{ controller_configuration_workflow_async_delay }}"

  rescue:
    - name: async | Removing variables existance from result_file
      ansible.builtin.replace:
        path: "{{ __workflows_node_async_result.results_file }}"
        regexp: \{\{.*?\}\}
        replace: ""

    - name: async | Load error details
      ansible.builtin.include_vars:
        file: "{{ __workflows_node_async_result.results_file }}"
        name: __error_data

    - name: async | Building list of not processed links
      ansible.builtin.set_fact:
        __workflow_nodes_links_error_list: "{{ __workflow_nodes_links_error_list | default([]) + [
                                                                    {
                                                                      'name': __error_data['invocation']['module_args']['name'] | default ('N/A'),
                                                                      'type': 'link issue',
                                                                      'error': __error_data['msg'] | default(__workflows_link_async_result['msg'])
                                                                    }
                                                                  ]
                                    }}"
